<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <style>
    text { font-family: 'Cascadia Code', 'JetBrains Mono', 'Fira Code', monospace; }
  </style>

  <!-- BG -->
  <rect width="1080" height="1080" fill="#0a0a0a"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1080" height="1080" fill="url(#grid)" opacity="0.5"/>

  <!-- Terminal frame -->
  <rect x="50" y="50" width="980" height="980" rx="10" fill="#0d0d0d" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Title bar -->
  <rect x="50" y="50" width="980" height="44" rx="10" fill="#151515"/>
  <rect x="50" y="78" width="980" height="16" fill="#151515"/>

  <!-- Traffic lights -->
  <circle cx="82" cy="72" r="7" fill="#ff5f57"/>
  <circle cx="106" cy="72" r="7" fill="#febc2e"/>
  <circle cx="130" cy="72" r="7" fill="#28c840"/>

  <!-- Terminal prompt -->
  <text x="82" y="140" font-size="28" fill="#ef4444" font-weight="bold">$</text>
  <text x="112" y="140" font-size="22" fill="#555">~/</text>
  <text x="140" y="140" font-size="22" fill="#888" font-weight="bold">terminalblog</text>

  <!-- Blinking cursor -->
  <rect x="980" y="125" width="12" height="22" fill="#ef4444" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Main content -->
  <g transform="translate(0, 20)">
    <rect x="100" y="312" width="6" height="419" rx="3" fill="#ef4444"/>
    <text x="130" y="350" font-family="'Cascadia Code','JetBrains Mono',monospace" font-size="38" font-weight="bold" fill="#ef4444">I cannot believe how much</text>
    <text x="130" y="407" font-family="'Cascadia Code','JetBrains Mono',monospace" font-size="38" font-weight="bold" fill="#ffffff">time I wasted on: choosing</text>
    <text x="130" y="464" font-family="'Cascadia Code','JetBrains Mono',monospace" font-size="38" font-weight="bold" fill="#ffffff">the perfect font,</text>
    <text x="130" y="521" font-family="'Cascadia Code','JetBrains Mono',monospace" font-size="38" font-weight="bold" fill="#ffffff">configuring dotfiles,</text>
    <text x="130" y="578" font-family="'Cascadia Code','JetBrains Mono',monospace" font-size="38" font-weight="bold" fill="#ffffff">making the perfect color</text>
    <text x="130" y="635" font-family="'Cascadia Code','JetBrains Mono',monospace" font-size="38" font-weight="bold" fill="#ffffff">scheme. Just use defaults</text>
    <text x="130" y="692" font-family="'Cascadia Code','JetBrains Mono',monospace" font-size="38" font-weight="bold" fill="#ffffff">and ship code.</text>
  </g>

  <!-- Subtitle / category -->
  <text x="540" y="935" text-anchor="middle" font-size="22" fill="#555">// hot take</text>

  <!-- Divider -->
  <line x1="80" y1="960" x2="1000" y2="960" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Footer -->
  <text x="540" y="992" text-anchor="middle" font-size="22" fill="#666" font-weight="bold">terminalblog.com</text>

  <!-- Accent bar -->
  <rect x="50" y="1010" width="980" height="4" rx="2" fill="#ef4444" opacity="0.6"/>

  <!-- Corner accent -->
  <rect x="1000" y="50" width="30" height="4" rx="2" fill="#ef4444" opacity="0.4"/>
</svg>