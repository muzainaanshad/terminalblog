<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0a0a0f" rx="8"/>
  <rect x="0" y="0" width="800" height="32" fill="#15151e" rx="8 8 0 0"/>
  <circle cx="16" cy="16" r="5" fill="#ef4444"/>
  <circle cx="32" cy="16" r="5" fill="#f59e0b"/>
  <circle cx="48" cy="16" r="5" fill="#22c55e"/>
  <text x="400" y="22" font-family="'Courier New',monospace" font-size="11" fill="#6b7280" text-anchor="middle">terminal — agent landscape</text>
  <line x1="0" y1="60" x2="800" y2="60" stroke="#1f2937" stroke-width="1"/>
  <text x="20" y="52" font-family="'Courier New',monospace" font-size="11" fill="#22c55e">$</text>
  <text x="36" y="52" font-family="'Courier New',monospace" font-size="11" fill="#e5e7eb">terminalblog landscape</text>
  <!-- Agent nodes arranged in a flow -->
  <!-- Row 1: Terminal Agents -->
  <text x="400" y="78" font-family="'Courier New',monospace" font-size="9" fill="#6b7280" text-anchor="middle">TERMINAL AGENTS</text>
  <line x1="60" y1="85" x2="740" y2="85" stroke="#1f2937" stroke-width="0.5"/>
  <!-- Agent boxes -->
  <g font-family="'Courier New',monospace" font-size="8">
    <!-- Row 1: Open Source -->
    <rect x="60" y="95" width="90" height="50" rx="4" fill="#15151e" stroke="#22c55e" stroke-width="1" opacity="0.9"/>
    <text x="105" y="118" fill="#22c55e" text-anchor="middle" font-size="9" font-weight="bold">Hermes</text>
    <text x="105" y="133" fill="#6b7280" text-anchor="middle" font-size="7">212K ★</text>

    <rect x="165" y="95" width="90" height="50" rx="4" fill="#15151e" stroke="#3b82f6" stroke-width="1" opacity="0.9"/>
    <text x="210" y="118" fill="#3b82f6" text-anchor="middle" font-size="9" font-weight="bold">Goose</text>
    <text x="210" y="133" fill="#6b7280" text-anchor="middle" font-size="7">51K ★</text>

    <rect x="270" y="95" width="90" height="50" rx="4" fill="#15151e" stroke="#a855f7" stroke-width="1" opacity="0.9"/>
    <text x="315" y="118" fill="#a855f7" text-anchor="middle" font-size="9" font-weight="bold">OpenCode</text>
    <text x="315" y="133" fill="#6b7280" text-anchor="middle" font-size="7">5K ★</text>

    <rect x="375" y="95" width="90" height="50" rx="4" fill="#15151e" stroke="#f59e0b" stroke-width="1" opacity="0.9"/>
    <text x="420" y="118" fill="#f59e0b" text-anchor="middle" font-size="9" font-weight="bold">Oh My Pi</text>
    <text x="420" y="133" fill="#6b7280" text-anchor="middle" font-size="7">16K ★</text>

    <rect x="480" y="95" width="90" height="50" rx="4" fill="#15151e" stroke="#ec4899" stroke-width="1" opacity="0.9"/>
    <text x="525" y="118" fill="#ec4899" text-anchor="middle" font-size="9" font-weight="bold">Codebuff</text>
    <text x="525" y="133" fill="#6b7280" text-anchor="middle" font-size="7">7K ★</text>

    <rect x="585" y="95" width="70" height="50" rx="4" fill="#15151e" stroke="#06b6d4" stroke-width="1" opacity="0.9"/>
    <text x="620" y="118" fill="#06b6d4" text-anchor="middle" font-size="9" font-weight="bold">Mimo</text>
    <text x="620" y="133" fill="#6b7280" text-anchor="middle" font-size="7">Fork</text>

    <rect x="670" y="95" width="70" height="50" rx="4" fill="#15151e" stroke="#84cc16" stroke-width="1" opacity="0.9"/>
    <text x="705" y="118" fill="#84cc16" text-anchor="middle" font-size="9" font-weight="bold">Kilo</text>
    <text x="705" y="133" fill="#6b7280" text-anchor="middle" font-size="7">Lite</text>

    <!-- Row 2: Desktop + IDE -->
    <text x="400" y="170" font-family="'Courier New',monospace" font-size="9" fill="#6b7280" text-anchor="middle">DESKTOP + IDE AGENTS</text>
    <line x1="60" y1="177" x2="740" y2="177" stroke="#1f2937" stroke-width="0.5"/>

    <rect x="60" y="187" width="110" height="50" rx="4" fill="#15151e" stroke="#22c55e" stroke-width="1" opacity="0.9"/>
    <text x="115" y="210" fill="#22c55e" text-anchor="middle" font-size="9" font-weight="bold">Claude Code</text>
    <text x="115" y="225" fill="#6b7280" text-anchor="middle" font-size="7">88.6% SWE-b</text>

    <rect x="185" y="187" width="90" height="50" rx="4" fill="#15151e" stroke="#22c55e" stroke-width="1" opacity="0.9"/>
    <text x="230" y="210" fill="#22c55e" text-anchor="middle" font-size="9" font-weight="bold">Cursor</text>
    <text x="230" y="225" fill="#6b7280" text-anchor="middle" font-size="7">91.2% SWE-b</text>

    <rect x="290" y="187" width="90" height="50" rx="4" fill="#15151e" stroke="#f59e0b" stroke-width="1" opacity="0.9"/>
    <text x="335" y="210" fill="#f59e0b" text-anchor="middle" font-size="9" font-weight="bold">OpenClaw</text>
    <text x="335" y="225" fill="#6b7280" text-anchor="middle" font-size="7">382K ★</text>

    <!-- Row 3: Cloud + Hybrid -->
    <text x="400" y="262" font-family="'Courier New',monospace" font-size="9" fill="#6b7280" text-anchor="middle">CLOUD + HYBRID AGENTS</text>
    <line x1="60" y1="269" x2="740" y2="269" stroke="#1f2937" stroke-width="0.5"/>

    <rect x="60" y="279" width="100" height="50" rx="4" fill="#15151e" stroke="#3b82f6" stroke-width="1" opacity="0.9"/>
    <text x="110" y="302" fill="#3b82f6" text-anchor="middle" font-size="9" font-weight="bold">Codex CLI</text>
    <text x="110" y="317" fill="#6b7280" text-anchor="middle" font-size="7">Cloud parallel</text>

    <rect x="175" y="279" width="100" height="50" rx="4" fill="#15151e" stroke="#3b82f6" stroke-width="1" opacity="0.9"/>
    <text x="225" y="302" fill="#3b82f6" text-anchor="middle" font-size="9" font-weight="bold">Copilot CLI</text>
    <text x="225" y="317" fill="#6b7280" text-anchor="middle" font-size="7">GitHub-native</text>

    <rect x="290" y="279" width="90" height="50" rx="4" fill="#15151e" stroke="#ec4899" stroke-width="1" opacity="0.9"/>
    <text x="335" y="302" fill="#ec4899" text-anchor="middle" font-size="9" font-weight="bold">AmpCode</text>
    <text x="335" y="317" fill="#6b7280" text-anchor="middle" font-size="7">Unconstrained</text>

    <!-- Row 4: Niche -->
    <text x="400" y="354" font-family="'Courier New',monospace" font-size="9" fill="#6b7280" text-anchor="middle">NICHE / SPECIALIZED</text>
    <line x1="60" y1="361" x2="740" y2="361" stroke="#1f2937" stroke-width="0.5"/>

    <rect x="60" y="371" width="100" height="50" rx="4" fill="#15151e" stroke="#a855f7" stroke-width="1" opacity="0.9"/>
    <text x="110" y="394" fill="#a855f7" text-anchor="middle" font-size="9" font-weight="bold">pi.dev</text>
    <text x="110" y="409" fill="#6b7280" text-anchor="middle" font-size="7">Knowledge graphs</text>

    <rect x="175" y="371" width="100" height="50" rx="4" fill="#15151e" stroke="#06b6d4" stroke-width="1" opacity="0.9"/>
    <text x="225" y="394" fill="#06b6d4" text-anchor="middle" font-size="9" font-weight="bold">Gitlawb Zero</text>
    <text x="225" y="409" fill="#6b7280" text-anchor="middle" font-size="7">Ownership</text>

    <rect x="290" y="371" width="60" height="50" rx="4" fill="#15151e" stroke="#84cc16" stroke-width="1" opacity="0.9"/>
    <text x="320" y="394" fill="#84cc16" text-anchor="middle" font-size="9" font-weight="bold">Kilo</text>
    <text x="320" y="409" fill="#6b7280" text-anchor="middle" font-size="7">Lightweight</text>
  </g>
  <!-- Footer -->
  <line x1="0" y1="440" x2="800" y2="440" stroke="#1f2937" stroke-width="1"/>
  <text x="20" y="462" font-family="'Courier New',monospace" font-size="9" fill="#6b7280">
    <tspan fill="#22c55e">15 agents</tspan> tracked · Updated every 3h · terminalblog.com
  </text>
  <text x="20" y="482" font-family="'Courier New',monospace" font-size="8" fill="#4b5563">
    Green = commercial · Blue = most popular · Purple = unique approach
  </text>
</svg>
