<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1500" y2="500">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#0d0d14"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1500" height="500" fill="url(#bg)"/>

  <!-- Grid dots pattern -->
  <g fill="#22c55e" opacity="0.04">
    <circle cx="50" cy="50" r="1"/><circle cx="150" cy="50" r="1"/><circle cx="250" cy="50" r="1"/>
    <circle cx="350" cy="50" r="1"/><circle cx="450" cy="50" r="1"/><circle cx="550" cy="50" r="1"/>
    <circle cx="650" cy="50" r="1"/><circle cx="750" cy="50" r="1"/><circle cx="850" cy="50" r="1"/>
    <circle cx="950" cy="50" r="1"/><circle cx="1050" cy="50" r="1"/><circle cx="1150" cy="50" r="1"/>
    <circle cx="1250" cy="50" r="1"/><circle cx="1350" cy="50" r="1"/><circle cx="1450" cy="50" r="1"/>
    <circle cx="50" cy="150" r="1"/><circle cx="150" cy="150" r="1"/><circle cx="250" cy="150" r="1"/>
    <circle cx="350" cy="150" r="1"/><circle cx="450" cy="150" r="1"/><circle cx="550" cy="150" r="1"/>
    <circle cx="650" cy="150" r="1"/><circle cx="750" cy="150" r="1"/><circle cx="850" cy="150" r="1"/>
    <circle cx="950" cy="150" r="1"/><circle cx="1050" cy="150" r="1"/><circle cx="1150" cy="150" r="1"/>
    <circle cx="1250" cy="150" r="1"/><circle cx="1350" cy="150" r="1"/><circle cx="1450" cy="150" r="1"/>
    <circle cx="50" cy="250" r="1"/><circle cx="150" cy="250" r="1"/><circle cx="250" cy="250" r="1"/>
    <circle cx="350" cy="250" r="1"/><circle cx="450" cy="250" r="1"/><circle cx="550" cy="250" r="1"/>
    <circle cx="650" cy="250" r="1"/><circle cx="750" cy="250" r="1"/><circle cx="850" cy="250" r="1"/>
    <circle cx="950" cy="250" r="1"/><circle cx="1050" cy="250" r="1"/><circle cx="1150" cy="250" r="1"/>
    <circle cx="1250" cy="250" r="1"/><circle cx="1350" cy="250" r="1"/><circle cx="1450" cy="250" r="1"/>
    <circle cx="50" cy="350" r="1"/><circle cx="150" cy="350" r="1"/><circle cx="250" cy="350" r="1"/>
    <circle cx="350" cy="350" r="1"/><circle cx="450" cy="350" r="1"/><circle cx="550" cy="350" r="1"/>
    <circle cx="650" cy="350" r="1"/><circle cx="750" cy="350" r="1"/><circle cx="850" cy="350" r="1"/>
    <circle cx="950" cy="350" r="1"/><circle cx="1050" cy="350" r="1"/><circle cx="1150" cy="350" r="1"/>
    <circle cx="1250" cy="350" r="1"/><circle cx="1350" cy="350" r="1"/><circle cx="1450" cy="350" r="1"/>
    <circle cx="50" cy="450" r="1"/><circle cx="150" cy="450" r="1"/><circle cx="250" cy="450" r="1"/>
    <circle cx="350" cy="450" r="1"/><circle cx="450" cy="450" r="1"/><circle cx="550" cy="450" r="1"/>
    <circle cx="650" cy="450" r="1"/><circle cx="750" cy="450" r="1"/><circle cx="850" cy="450" r="1"/>
    <circle cx="950" cy="450" r="1"/><circle cx="1050" cy="450" r="1"/><circle cx="1150" cy="450" r="1"/>
    <circle cx="1250" cy="450" r="1"/><circle cx="1350" cy="450" r="1"/><circle cx="1450" cy="450" r="1"/>
  </g>

  <!-- Big ~/ symbol left -->
  <g filter="url(#glow)">
    <text x="130" y="290" font-family="'JetBrains Mono', 'Consolas', 'Courier New', monospace" font-size="180" font-weight="700" fill="#22c55e" text-anchor="middle" opacity="0.15">~/</text>
  </g>

  <!-- Brand name -->
  <text x="400" y="210" font-family="'JetBrains Mono', 'Consolas', 'Courier New', monospace" font-size="56" font-weight="700" fill="#22c55e">
    terminalblog
    <tspan fill="#f59e0b" font-size="40" font-weight="400">_en</tspan>
  </text>

  <!-- Tagline -->
  <text x="400" y="260" font-family="'JetBrains Mono', 'Consolas', 'Courier New', monospace" font-size="20" fill="#6b7280" opacity="0.8">
    tracking the AI coding agent ecosystem
  </text>

  <!-- Separator line -->
  <line x1="400" y1="290" x2="650" y2="290" stroke="#22c55e" stroke-width="1" opacity="0.4"/>

  <!-- Stats -->
  <text x="400" y="325" font-family="'JetBrains Mono', 'Consolas', 'Courier New', monospace" font-size="15" fill="#6b7280">
    <tspan fill="#22c55e">15</tspan> agents tracked  ·  <tspan fill="#22c55e">122</tspan> articles  ·  updated <tspan fill="#22c55e">every 3h</tspan>
  </text>

  <!-- Right side: terminal window art -->
  <rect x="920" y="120" width="500" height="280" rx="8" fill="#15151e" stroke="#1f2937" stroke-width="1"/>
  <!-- Window title bar -->
  <rect x="920" y="120" width="500" height="36" rx="8" fill="#1a1a24"/>
  <rect x="920" y="139" width="500" height="17" fill="#1a1a24"/>
  <!-- Window buttons -->
  <circle cx="945" cy="138" r="6" fill="#ef4444"/>
  <circle cx="968" cy="138" r="6" fill="#f59e0b"/>
  <circle cx="991" cy="138" r="6" fill="#22c55e"/>
  <!-- Window title text -->
  <text x="1170" y="143" font-family="'JetBrains Mono', 'Consolas', 'Courier New', monospace" font-size="13" fill="#6b7280" text-anchor="middle">terminal — bash</text>

  <!-- Terminal content -->
  <text x="940" y="185" font-family="'JetBrains Mono', 'Consolas', 'Courier New', monospace" font-size="14" fill="#6b7280">
    <tspan x="940" dy="0" fill="#22c55e">$</tspan> npx terminalblog
    <tspan x="940" dy="28" fill="#22c55e">$</tspan> terminalblog compare cursor claude-code
    <tspan x="940" dy="28" fill="#e5e7eb">Claude Code vs Cursor in 2026</tspan>
    <tspan x="940" dy="22" fill="#6b7280">Comparing 15 agents across pricing,</tspan>
    <tspan x="940" dy="20" fill="#6b7280">features, benchmarks, and workflows.</tspan>
    <tspan x="940" dy="28" fill="#22c55e">$</tspan> terminalblog latest
    <tspan x="940" dy="28" fill="#e5e7eb">Better Tools Made Copilot's Code Review Worse</tspan>
    <tspan x="940" dy="22" fill="#6b7280">Jul 11, 2026 · 3 min read</tspan>
    <tspan x="940" dy="28" fill="#22c55e">$</tspan> <tspan fill="#e5e7eb">—</tspan>
  </text>

  <!-- Bottom URL bar -->
  <rect x="920" y="365" width="500" height="35" rx="0 0 8 8" fill="#1f2937" opacity="0.5"/>
  <text x="1170" y="388" font-family="'JetBrains Mono', 'Consolas', 'Courier New', monospace" font-size="12" fill="#22c55e" text-anchor="middle">terminalblog.com</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="490" width="1500" height="10" fill="url(#accent)" opacity="0.6"/>
</svg>
