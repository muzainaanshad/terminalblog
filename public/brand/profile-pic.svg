<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" rx="80" fill="url(#bg)"/>
  <rect width="400" height="400" rx="80" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.3"/>

  <!-- CRT scanline effect -->
  <g opacity="0.03">
    <line x1="0" y1="20" x2="400" y2="20" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="40" x2="400" y2="40" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="60" x2="400" y2="60" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="80" x2="400" y2="80" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="100" x2="400" y2="100" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="120" x2="400" y2="120" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="140" x2="400" y2="140" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="160" x2="400" y2="160" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="180" x2="400" y2="180" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="200" x2="400" y2="200" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="220" x2="400" y2="220" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="240" x2="400" y2="240" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="260" x2="400" y2="260" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="280" x2="400" y2="280" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="300" x2="400" y2="300" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="320" x2="400" y2="320" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="340" x2="400" y2="340" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="360" x2="400" y2="360" stroke="#22c55e" stroke-width="1"/>
    <line x1="0" y1="380" x2="400" y2="380" stroke="#22c55e" stroke-width="1"/>
  </g>

  <!-- Prompt symbol -->
  <g filter="url(#glow)">
    <text x="200" y="180" font-family="'JetBrains Mono', 'Consolas', 'Courier New', monospace" font-size="120" font-weight="700" fill="#22c55e" text-anchor="middle" dominant-baseline="middle">~/</text>
    <text x="200" y="250" font-family="'JetBrains Mono', 'Consolas', 'Courier New', monospace" font-size="22" font-weight="400" fill="#22c55e" text-anchor="middle" dominant-baseline="middle" opacity="0.9">terminalblog_en</text>
  </g>

  <!-- Cursor blink -->
  <rect x="330" y="160" width="8" height="80" rx="2" fill="#22c55e" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
