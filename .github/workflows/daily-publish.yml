name: Auto Article Publish

on:
  schedule:
    - cron: '0 */3 * * *'   # Every 3 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI Content Engine (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ai-content-engine.js

      - name: Check for new files
        id: check
        run: |
          git add src/content/blog/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No new articles generated"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "New articles detected"
          fi

      - name: Configure Git
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "Coding Agents Bot"
          git config user.email "bot@codingagents.dev"

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          FILENAME=$(git diff --cached --name-only src/content/blog/ | head -1 | xargs basename)
          git commit -m "chore: auto-publish article [skip ci]"
          git push

      - name: Trigger Vercel deployment
        if: steps.check.outputs.changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -s -X POST "https://api.vercel.com/v1/integrations/deploy/prj_${{ secrets.VERCEL_PROJECT_ID }}?vercel_token=${{ secrets.VERCEL_TOKEN }}" || true
