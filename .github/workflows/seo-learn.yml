# Weekly SEO learnings report -> Telegram
name: SEO Learn

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate learnings
        run: |
          node scripts/content-gate.cjs || true
          node scripts/clear-historical-debt.cjs || true
          node scripts/seo-learn.cjs || true
        continue-on-error: true
      # Telegram muted — SEO learnings roll into Ops Digest (Articles Management) when new
      - name: Upload SEO learn artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-learn
          path: |
            docs/seo-learnings/**
            seo-learnings-latest.json
          if-no-files-found: ignore
