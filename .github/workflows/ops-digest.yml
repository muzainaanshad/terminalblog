# Daily Telegram ops digest (Articles Management format)
name: Ops Digest

on:
  schedule:
    - cron: '0 13 * * *' # daily 13:00 UTC — after leaderboard (12:00)
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback days (default 1)'
        required: false
        default: '1'

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for git name-status / diffs

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Restore state from previous run
      - name: Restore digest state
        uses: actions/cache@v4
        with:
          path: tmp/ops-digest-state.json
          key: ops-digest-state-${{ github.repository }}
          restore-keys: |
            ops-digest-state-

      - name: Build + send ops digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p tmp
          DAYS="${{ github.event.inputs.days }}"
          if [ -z "$DAYS" ]; then DAYS=1; fi
          node scripts/telegram-ops-digest.cjs --days "$DAYS" --send

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-digest
          path: |
            tmp/ops-digest.html
            tmp/ops-digest-meta.json
