# Daily adoption snapshot + Telegram
name: Leaderboard Snapshot

on:
  schedule:
    - cron: '0 12 * * *' # daily 12:00 UTC
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch adoption data (OSS multi-signal v3)
        env:
          # Prefer a classic PAT with public_repo if GITHUB_TOKEN is restricted;
          # fetcher auto-retries without auth on 401 (bad credentials).
          GITHUB_TOKEN: ${{ secrets.ADOPTION_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p tmp
          node scripts/fetch-adoption-data.cjs --force 2>&1 | tee tmp/adoption-log.txt
        continue-on-error: true
      - name: Leaderboard note
        run: |
          mkdir -p tmp
          node scripts/gen-weekly-leaderboard-note.cjs > tmp/leaderboard-note.txt || echo "leaderboard note failed" > tmp/leaderboard-note.txt
        continue-on-error: true
      - name: Commit snapshot if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/adoption/snapshots/*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "chore: daily adoption snapshot"
            git push
          fi
        continue-on-error: true
      # Telegram muted — leaderboard changes roll into Ops Digest (Articles Management)
      - name: Upload leaderboard note
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-note
          path: |
            tmp/leaderboard-note.txt
            tmp/adoption-log.txt
          if-no-files-found: ignore
