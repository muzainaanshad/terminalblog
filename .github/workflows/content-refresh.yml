# Periodic evergreen refresh queue -> Telegram
name: Content Refresh Queue

on:
  schedule:
    - cron: '0 5 * * 3' # Wednesdays 05:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build refresh queue
        run: node scripts/content-refresh.cjs --days 45
      - name: Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/telegram-notify.cjs --title "Content refresh queue" --file tmp/content-refresh-report.txt
