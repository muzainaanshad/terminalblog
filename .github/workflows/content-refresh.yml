# Periodic evergreen refresh queue -> Telegram
name: Content Refresh Queue

on:
  schedule:
    - cron: '0 5 * * 3' # Wednesdays 05:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build refresh queue
        run: node scripts/content-refresh.cjs --days 45
      # Telegram muted — only Ops Digest (Articles Management) may send to Telegram
      - name: Upload refresh report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-refresh-report
          path: tmp/content-refresh-report.txt
          if-no-files-found: ignore
