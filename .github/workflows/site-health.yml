# Site health checks — results stay in Actions logs (no Telegram).
# Telegram: only Ops Digest (Articles Management format).
name: Site Health

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run health checks
        run: node scripts/site-health.cjs
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: tmp/health-report.txt
          if-no-files-found: ignore
